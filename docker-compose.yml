version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notesforall-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - APP_ADMIN_USERNAME=admin
      - APP_ADMIN_PASSWORD=admin123
      - APP_JWT_SECRET=notesforall-secret-key-very-long-string-for-security-production
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    networks:
      - notesforall-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: notesforall-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - notesforall-net

networks:
  notesforall-net:
    driver: bridge
